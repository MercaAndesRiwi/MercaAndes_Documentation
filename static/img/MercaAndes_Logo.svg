<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Logo de MercaAndes</title>
<desc>Marca MercaAndes: tres picos montañosos superpuestos junto al nombre de la marca, en tonos azul marino y cobre.</desc>
<polygon points="60,200 120,100 180,200" fill="#B9863E"/>
<polygon points="140,200 200,100 260,200" fill="#B9863E"/>
<polygon points="90,200 160,58 230,200" fill="#15213B"/>
<line x1="60" y1="200.5" x2="260" y2="200.5" stroke="#15213B" stroke-width="2" stroke-linecap="round"/>
<text x="300" y="118" font-family="Poppins, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="600" letter-spacing="0.5">
<tspan fill="#15213B">Merca</tspan><tspan fill="#B9863E">Andes</tspan>
</text>
<line x1="301" y1="140" x2="600" y2="140" stroke="#B9863E" stroke-width="1" opacity="0.55"/>
<text x="301" y="165" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="2.5" fill="#5B6472">RETAIL OMNICANAL</text>
</svg>
